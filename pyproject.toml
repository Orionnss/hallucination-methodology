[project]
name = "hbench"
version = "0.1.0"
description = "Benchmark pipeline for published white-box hallucination detectors"
requires-python = ">=3.12,<3.13"

# One environment for all stages (DECISIONS.md D62): the generators and judges need transformers ≥ 5.8.
# scikit-learn and pandas stay pinned to lapeigvals' versions (commit 74f885c).
dependencies = [
  "torch==2.9.1",
  "transformers==5.20.2",
  "accelerate==1.10.1",
  "bitsandbytes==0.50.2",
  "datasets==5.0.1",
  "torch-geometric==2.8.0.post1",  # CHARM (D71)
  "wandb==0.30.0",  # imported at module level by CHARM's training.py; runs disabled
  "kernels==0.17.2",  # MXFP4 kernels for gpt-oss (D60)
  "scikit-learn==1.6.1",
  "pandas==2.2.3",
  "pydantic==2.12.5",  # was 2.11.3 (lapeigvals pin); kernels needs ≥ 2.12 (D73)
  "loguru==0.7.2",
  "typer>=0.12.5",
  "tqdm>=4.66.4",
  "pyarrow>=17",
  "h5py>=3.11",
  "pyyaml>=6",
  "scipy>=1.13",
  "omegaconf==2.3.0",
  "psutil>=7.2.2",
]

[project.scripts]
hbench = "hbench.cli:app"

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hbench"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
